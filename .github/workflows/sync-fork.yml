name: Sync Fork
on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        # Manual full-chain rebuild (nextbsd-kernel#324): toolchain, then
        # kernel and base, then kexts, contrib and userland, at the current
        # releng/15.1 SHA. Use it when merges in a downstream repo (e.g. the
        # kernel) should be carried into the kexts and images; merges there
        # never start the chain themselves.
        description: 'Rebuild the whole chain even if releng/15.1 did not move'
        type: boolean
        default: false

# This is the ONLY workflow on this fork. It lives on the default branch (main)
# because scheduled workflows only fire from the default branch, but its job
# operates exclusively on releng/15.1. Upstream FreeBSD workflows have been
# removed from main so nothing else runs here.

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # required for gh repo sync (merge-upstream API)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: releng/15.1
          fetch-depth: 1

      - name: Get current SHA
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync from upstream
        run: gh repo sync ${{ github.repository }} --branch releng/15.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if changed
        id: after
        run: |
          git fetch origin releng/15.1
          NEW_SHA=$(git rev-parse origin/releng/15.1)
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before.outputs.sha }}" != "$NEW_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The chain starts only here: when releng/15.1 moved, or on a manual run
      # with `force`. inputs.force is empty on scheduled runs.
      - name: Trigger toolchain rebuild
        if: steps.after.outputs.changed == 'true' || inputs.force
        run: |
          gh api repos/nextbsd/nextbsd-toolchain/dispatches \
            -f event_type=upstream-updated \
            -f "client_payload[sha]=${{ steps.after.outputs.sha }}" \
            -f "client_payload[branch]=releng/15.1"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
